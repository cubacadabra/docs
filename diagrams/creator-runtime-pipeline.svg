<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">Creator to runtime pipeline</title><desc id="desc">Creator source flows through validation and dependency resolution into a hashed portable game package, then through host loaders into the shared runtime.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:27px;font-weight:750;fill:#102a43}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#52606d}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}
  </style></defs>
  <text x="50" y="50" class="eyebrow">CONTRACTS / BUILD PATH</text><text x="50" y="84" class="title">From editable source to executable package</text>
  <rect x="50" y="130" width="260" height="270" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="76" y="162" class="eyebrow">01 / SOURCE</text><text x="76" y="201" class="label">manifest.json</text><text x="76" y="223" class="small">world + package metadata</text><text x="76" y="260" class="label">src/main.luau</text><text x="76" y="282" class="small">creator game rules</text><text x="76" y="319" class="label">src/server.luau</text><text x="76" y="341" class="small">optional authority entry</text><text x="76" y="378" class="label">declared assets</text>
  <rect x="370" y="130" width="280" height="270" rx="18" fill="#eef2ff" stroke="#a5b4fc"/><text x="396" y="162" class="eyebrow">02 / BUILDER</text><text x="396" y="208" class="label">validate</text><text x="396" y="230" class="small">fields, paths, limits</text><text x="396" y="267" class="label">resolve</text><text x="396" y="289" class="small">modules + dependency graph</text><text x="396" y="326" class="label">bundle</text><text x="396" y="348" class="small">SDK + reachable Luau</text><text x="396" y="385" class="label">hash</text><text x="396" y="407" class="small">descriptor + integrity map</text>
  <rect x="710" y="130" width="330" height="270" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="736" y="162" class="eyebrow">03 / PORTABLE PACKAGE</text><text x="736" y="207" class="label">manifest + package.json</text><text x="736" y="229" class="small">format 3 · SDK version · file hashes</text><text x="736" y="266" class="label">game.luau</text><text x="736" y="288" class="small">self-contained creator + SDK code</text><text x="736" y="325" class="label">assets/</text><text x="736" y="347" class="small">runtime-declared content</text><text x="736" y="384" class="label">authority.luau</text><text x="736" y="406" class="small">optional packaged prototype</text>
  <rect x="1100" y="130" width="350" height="270" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1126" y="162" class="eyebrow">04 / HOST + RUNTIME</text><text x="1126" y="207" class="label">verify before use</text><text x="1126" y="229" class="small">descriptor, files, hashes</text><text x="1126" y="266" class="label">load on host</text><text x="1126" y="288" class="small">web · iOS · Android · Studio</text><text x="1126" y="325" class="label">execute shared semantics</text><text x="1126" y="347" class="small">engine · client · app</text><text x="1126" y="384" class="small">authority execution is not live yet</text>
  <path d="M310 265H370" class="edge"/><path d="M650 265H710" class="edge"/><path d="M1040 265H1100" class="edge"/>
  <text x="50" y="458" class="small">A local Studio preview is useful evidence, but it does not replace package validation or real host conformance.</text>
</svg>
