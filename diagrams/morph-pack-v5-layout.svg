<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 780" role="img" aria-labelledby="title desc">
  <title id="title">MorphPack v5 binary layout</title><desc id="desc">MorphPack v5 stores a magic header, schema and metadata, then textures and three LOD blocks in Near, Mid, Far order. Each LOD contains surfaces, positions, authored normals, UVs, optional skin bindings and indices.</desc>
  <defs><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.offset{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;fill:#627d98}
  </style></defs>
  <text x="55" y="54" class="eyebrow">CONTRACTS / BINARY SCHEMATIC</text><text x="55" y="90" class="title">MorphPack v5: bounded binary layout</text><text x="55" y="118" class="small">All scalar fields are little-endian; the shared runtime accepts schema v5 only.</text>
  <text x="90" y="170" class="offset">OFFSET</text><rect x="180" y="145" width="580" height="68" rx="12" fill="#eef2ff" stroke="#a5b4fc"/><text x="210" y="175" class="label">CUBAMORP magic</text><text x="540" y="175" class="small">8 bytes · schema u16 = 5 · flags u16</text><text x="210" y="196" class="small">manifest length u32 + manifest JSON bytes</text>
  <text x="90" y="250" class="offset">0x0020</text><rect x="180" y="225" width="580" height="64" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="210" y="255" class="label">Texture table</text><text x="540" y="255" class="small">count u8 (0–4) · dimensions u16 · RGBA8 payloads</text>
  <text x="90" y="326" class="offset">0x....</text><rect x="180" y="301" width="580" height="270" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="210" y="333" class="label">LOD Near</text><text x="210" y="359" class="small">triangle / vertex / index counts u32</text><text x="210" y="382" class="small">surface spans + color/avatar-tint/texture flags</text><text x="210" y="405" class="small">positions: vertex_count × VEC3 float</text><text x="210" y="428" class="small">authored normals: vertex_count × VEC3 float</text><text x="210" y="451" class="small">UVs: vertex_count × VEC2 float</text><text x="210" y="474" class="small">optional four-joint bindings + weights</text><text x="210" y="497" class="small">indices: index_count × u32</text><path d="M210 522H710" stroke="#bfdbfe"/><text x="210" y="547" class="tiny">LOD Mid and LOD Far repeat the same block shape.</text>
  <text x="90" y="615" class="offset">0x....</text><rect x="180" y="590" width="580" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="210" y="620" class="label">LOD Mid</text><text x="540" y="620" class="small">same bounded block schema</text>
  <text x="90" y="691" class="offset">0x....</text><rect x="180" y="666" width="580" height="62" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="210" y="696" class="label">LOD Far</text><text x="540" y="696" class="small">same bounded block schema</text>
  <rect x="805" y="225" width="190" height="430" rx="18" fill="#fffaf0" stroke="#f6c453"/><text x="830" y="258" class="eyebrow">INVARIANTS</text><text x="830" y="300" class="small">normals are finite</text><text x="830" y="322" class="small">unit vectors 0.98–1.02</text><text x="830" y="370" class="small">no per-frame</text><text x="830" y="392" class="small">normal recomputation</text><text x="830" y="440" class="small">textures max 512 px</text><text x="830" y="488" class="small">source normals required</text><text x="830" y="536" class="small">schemas 1–4 reject</text><text x="830" y="584" class="small">runtime shared across</text><text x="830" y="606" class="small">desktop, web, iOS, Android</text>
</svg>
