<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra products: Studio and Player</title>
  <desc id="desc">Cubacadabra Studio is creator software for macOS, Windows and Linux. Cubacadabra Player is end-user software for web, iOS, Android, and planned native desktop targets. Both consume the same portable package and shared Rust runtime, but Player does not include editor machinery.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;fill:#64748b}.title{font-size:30px;font-weight:750;fill:#102a43}.sub{font-size:15px;fill:#52606d}.label{font-size:17px;font-weight:700}.small{font-size:13px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#c0841a;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="54" class="eyebrow">CUBACADABRA / PRODUCT MAP</text><text x="60" y="92" class="title">Build with Studio. Play with Player.</text><text x="60" y="121" class="sub">Two products share packages and runtime semantics without sharing the same job.</text>

  <rect x="60" y="165" width="560" height="310" rx="22" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.7"/><text x="90" y="201" class="eyebrow">CREATE / CREATOR APPLICATION</text><text x="90" y="244" class="label">Cubacadabra Studio</text><rect x="420" y="220" width="154" height="34" rx="10" fill="#fff" stroke="#a5b4fc"/><text x="497" y="242" text-anchor="middle" class="small">CURRENT</text><text x="90" y="279" class="small">Author projects · import assets · build packages</text><text x="90" y="302" class="small">Preview and test with the real shared runtime</text><text x="90" y="325" class="small">Editor, project store, diagnostics and local workflows</text><path d="M90 351H590" stroke="#c7d2fe"/><text x="90" y="380" class="eyebrow">DESKTOP RELEASE TARGETS</text><rect x="90" y="400" width="145" height="42" rx="11" fill="#fff" stroke="#a5b4fc"/><text x="162" y="426" text-anchor="middle" class="small">macOS · arm64</text><rect x="250" y="400" width="145" height="42" rx="11" fill="#fff" stroke="#a5b4fc"/><text x="322" y="426" text-anchor="middle" class="small">Windows · x86_64</text><rect x="410" y="400" width="145" height="42" rx="11" fill="#fff" stroke="#a5b4fc"/><text x="482" y="426" text-anchor="middle" class="small">Linux · x86_64</text>

  <rect x="780" y="165" width="560" height="310" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.7"/><text x="810" y="201" class="eyebrow">PLAY / PLAYER APPLICATION</text><text x="810" y="244" class="label">Cubacadabra Player</text><rect x="1190" y="220" width="120" height="34" rx="10" fill="#fff" stroke="#c4b5fd"/><text x="1250" y="242" text-anchor="middle" class="small">PRODUCT</text><text x="810" y="279" class="small">Load catalog/package · account · settings</text><text x="810" y="302" class="small">Run game sessions without editor machinery</text><text x="810" y="325" class="small">One player shell, platform-specific integration</text><path d="M810 351H1310" stroke="#ddd6fe"/><text x="810" y="380" class="eyebrow">TARGETS</text><rect x="810" y="400" width="112" height="42" rx="11" fill="#dcfce7" stroke="#86efac"/><text x="866" y="426" text-anchor="middle" class="small">Web · current</text><rect x="937" y="400" width="112" height="42" rx="11" fill="#dcfce7" stroke="#86efac"/><text x="993" y="426" text-anchor="middle" class="small">iOS · current</text><rect x="1064" y="400" width="125" height="42" rx="11" fill="#dcfce7" stroke="#86efac"/><text x="1126" y="426" text-anchor="middle" class="small">Android · current</text><rect x="1204" y="400" width="106" height="42" rx="11" fill="#fffaf0" stroke="#f6c453" stroke-dasharray="6 5"/><text x="1257" y="426" text-anchor="middle" class="small">Desktop · planned</text>

  <rect x="330" y="520" width="740" height="76" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="700" y="550" text-anchor="middle" class="eyebrow">SAME PORTABLE GAME PACKAGE</text><text x="700" y="576" text-anchor="middle" class="label">manifest · game.luau · declared assets · hashes</text><path d="M340 475V520" class="edge"/><path d="M1060 475V520" class="edge"/>
  <rect x="390" y="650" width="620" height="76" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="700" y="680" text-anchor="middle" class="eyebrow">SHARED RUST RUNTIME</text><text x="700" y="706" text-anchor="middle" class="label">engine · client · app state · renderer-facing semantics</text><path d="M700 596V650" class="edge"/>
  <text x="60" y="756" class="tiny">Studio and Desktop Player are both desktop Rust hosts, but Player reuses the runtime, not the editor.</text>
</svg>
