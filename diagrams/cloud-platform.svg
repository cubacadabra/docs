<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 800" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra cloud platform topology</title><desc id="desc">Host clients connect through the Worker edge to Durable Objects for live game coordination, D1 for durable product records, R2 for immutable content, and Queues for deferred work.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:29px;font-weight:750;fill:#102a43}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#c0841a;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style></defs>
  <text x="55" y="54" class="eyebrow">PLATFORM / SERVICE TOPOLOGY</text><text x="55" y="91" class="title">Hot game state, durable product data, immutable content</text><text x="55" y="119" class="small">Each service has a distinct job. Queues are deliberately outside the live game loop.</text>
  <rect x="55" y="157" width="280" height="470" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/><text x="82" y="190" class="eyebrow">HOSTS</text><rect x="82" y="220" width="225" height="64" rx="13" fill="#fff" stroke="#c4b5fd"/><text x="104" y="247" class="label">Web / WASM</text><text x="104" y="267" class="small">host-owned transport</text><rect x="82" y="310" width="225" height="64" rx="13" fill="#fff" stroke="#c4b5fd"/><text x="104" y="337" class="label">iOS / Android</text><text x="104" y="357" class="small">Swift / Kotlin bridges</text><rect x="82" y="400" width="225" height="64" rx="13" fill="#fff" stroke="#c4b5fd"/><text x="104" y="427" class="label">Studio</text><text x="104" y="447" class="small">local preview + auth</text><rect x="82" y="490" width="225" height="90" rx="13" fill="#fffaf0" stroke="#f6c453"/><text x="104" y="520" class="label">Authenticated actor</text><text x="104" y="542" class="small">identity is host-owned</text><text x="104" y="560" class="small">not package state</text>
  <rect x="405" y="157" width="300" height="470" rx="20" fill="#fffaf0" stroke="#f6c453"/><text x="432" y="190" class="eyebrow">EDGE + LIVE INSTANCE</text><rect x="432" y="220" width="246" height="72" rx="13" fill="#fff" stroke="#f6c453"/><text x="455" y="248" class="label">Worker</text><text x="455" y="270" class="small">routing · auth checks · APIs</text><rect x="432" y="330" width="246" height="130" rx="13" fill="#fff" stroke="#c0841a" stroke-width="2"/><text x="455" y="360" class="label">World Durable Object</text><text x="455" y="383" class="small">one coordinator / game instance</text><text x="455" y="405" class="small">ordered state + WebSockets</text><text x="455" y="427" class="small">SQLite retained state</text><rect x="432" y="500" width="246" height="80" rx="13" fill="#fff" stroke="#f6c453"/><text x="455" y="531" class="label">authority.luau</text><text x="455" y="553" class="small">proposed trusted execution</text>
  <rect x="775" y="157" width="620" height="470" rx="20" fill="#f8fafc" stroke="#d9e2ec"/><text x="802" y="190" class="eyebrow">DURABLE SYSTEMS</text><rect x="802" y="220" width="250" height="100" rx="14" fill="#fff" stroke="#fbbf24"/><text x="827" y="251" class="label">D1</text><text x="827" y="274" class="small">accounts · sessions</text><text x="827" y="294" class="small">moderation · progression</text><rect x="1090" y="220" width="250" height="100" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="1115" y="251" class="label">R2</text><text x="1115" y="274" class="small">immutable packages</text><text x="1115" y="294" class="small">MorphPacks · thumbnails</text><rect x="802" y="365" width="250" height="100" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="827" y="396" class="label">Catalog metadata</text><text x="827" y="419" class="small">active release + channel</text><text x="827" y="439" class="small">references hashed R2 objects</text><rect x="1090" y="365" width="250" height="100" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="1115" y="396" class="label">Queues</text><text x="1115" y="419" class="small">analytics · cleanup</text><text x="1115" y="439" class="small">deferred, at-least-once</text><rect x="802" y="510" width="538" height="70" rx="13" fill="#fffaf0" stroke="#f6c453"/><text x="1071" y="539" text-anchor="middle" class="label">Trusted authority boundary</text><text x="1071" y="560" text-anchor="middle" class="small">prototype today · integration work remains</text>
  <path d="M335 285H405" class="edge"/><path d="M335 345H405" class="edge"/><path d="M335 435H405" class="edge"/><path d="M705 270H775" class="edge"/><path d="M705 390H775" class="edge"/><path d="M705 540H802" class="dashed"/><path d="M678 365H802" class="edge"/><path d="M678 430H1090" class="edge"/><path d="M1052 270H1090" class="edge"/><path d="M1052 415H1090" class="edge"/>
  <text x="55" y="694" class="tiny">Current guidance: keep live state in the instance object; use D1 for durable records; use R2 for immutable blobs; never route gameplay through Queues.</text><text x="55" y="730" class="tiny">Dashed amber path is proposed trusted game-rule execution and is not a claim of live Durable Object integration.</text>
</svg>
