<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 610" role="img" aria-labelledby="title desc">
  <title id="title">Morph asset pipeline</title><desc id="desc">Editable GLB source and a mapping sidecar flow through the compiler into MorphPack v5, which is previewed locally and can later be stored as an immutable SHA-256-addressed R2 object with catalog metadata.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#c0841a;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style></defs>
  <text x="50" y="52" class="eyebrow">ASSETS / MORPHPACK V5</text><text x="50" y="88" class="title">Editable source becomes a bounded, shared runtime asset</text><text x="50" y="116" class="small">The current Studio slice is local-first; immutable catalog distribution is an operator-managed path.</text>
  <rect x="50" y="175" width="255" height="250" rx="18" fill="#f0fdf4" stroke="#86efac"/><text x="77" y="207" class="eyebrow">01 / SOURCE</text><text x="77" y="252" class="label">character.glb</text><text x="77" y="275" class="small">geometry · normals · UVs</text><text x="77" y="316" class="label">source.morph.json</text><text x="77" y="339" class="small">mapping + fit metadata</text><text x="77" y="380" class="small">creator-owned repository</text>
  <rect x="380" y="175" width="255" height="250" rx="18" fill="#eef2ff" stroke="#a5b4fc"/><text x="407" y="207" class="eyebrow">02 / COMPILER</text><text x="407" y="252" class="label">inspect + validate</text><text x="407" y="275" class="small">supported mapping</text><text x="407" y="316" class="label">compile</text><text x="407" y="339" class="small">bounded payloads</text><text x="407" y="380" class="small">reject missing normals/schema</text>
  <rect x="710" y="145" width="300" height="310" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="737" y="177" class="eyebrow">03 / MORPHPACK V5</text><rect x="737" y="207" width="246" height="37" rx="9" fill="#f8fafc" stroke="#cbd5e1"/><text x="860" y="231" text-anchor="middle" class="small">header + metadata</text><rect x="737" y="255" width="246" height="37" rx="9" fill="#f0fdf4" stroke="#86efac"/><text x="860" y="279" text-anchor="middle" class="small">textures</text><rect x="737" y="303" width="246" height="37" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="860" y="327" text-anchor="middle" class="small">Near / Mid / Far LODs</text><rect x="737" y="351" width="246" height="37" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="860" y="375" text-anchor="middle" class="small">positions + authored normals</text><rect x="737" y="399" width="246" height="37" rx="9" fill="#f8fafc" stroke="#cbd5e1"/><text x="860" y="423" text-anchor="middle" class="small">UVs · skinning · indices</text>
  <rect x="1085" y="175" width="365" height="250" rx="18" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1112" y="207" class="eyebrow">04 / CONSUMPTION</text><text x="1112" y="252" class="label">Studio preview</text><text x="1112" y="275" class="small">direct shared renderer</text><text x="1112" y="316" class="label">R2 object</text><text x="1112" y="339" class="small">SHA-256-addressed immutable pack</text><text x="1112" y="380" class="label">D1 catalog</text><text x="1112" y="403" class="small">active release metadata → clients</text>
  <path d="M305 300H380" class="edge"/><path d="M635 300H710" class="edge"/><path d="M1010 300H1085" class="edge"/><path d="M1267 425V475H860V455" class="dashed"/>
  <rect x="365" y="500" width="770" height="54" rx="12" fill="#fffaf0" stroke="#f6c453"/><text x="750" y="534" text-anchor="middle" class="small">No source GLB, Blender file, or executable code is exposed through public runtime asset URLs.</text>
</svg>
