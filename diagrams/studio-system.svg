<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 800" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra Studio architecture</title><desc id="desc">Studio owns the local project, workspace and editor state. Builder and asset compiler produce derived package and MorphPack outputs. A live renderer preview uses the shared Rust runtime. Network services are only used for explicit sign-in and future publishing.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:29px;font-weight:750;fill:#102a43}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#c0841a;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="55" y="54" class="eyebrow">STUDIO / LOCAL AUTHORING HOST</text><text x="55" y="91" class="title">A real project workspace around the shared runtime</text><text x="55" y="119" class="small">Current Studio work is local-first: import, validate, compile and preview without requiring an account.</text>
  <rect x="55" y="157" width="410" height="490" rx="20" fill="#f8fafc" stroke="#cbd5e1"/><text x="83" y="190" class="eyebrow">PROJECT + WORKSPACE</text><rect x="83" y="220" width="354" height="92" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="108" y="252" class="label">Project store</text><text x="108" y="275" class="small">manifest.json · src/ · assets/</text><text x="108" y="295" class="small">source GLB + sidecar + catalog</text><rect x="83" y="340" width="354" height="92" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="108" y="372" class="label">Editor state</text><text x="108" y="395" class="small">selection · inspector · undo path</text><text x="108" y="415" class="small">manual edits remain host-visible</text><rect x="83" y="460" width="354" height="140" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><text x="108" y="492" class="label">Workspace</text><text x="108" y="515" class="small">scene / asset browser</text><text x="108" y="537" class="small">character workspace</text><text x="108" y="559" class="small">preview controls + diagnostics</text><text x="108" y="581" class="small">File → New Project…</text>
  <rect x="535" y="157" width="390" height="490" rx="20" fill="#eef2ff" stroke="#a5b4fc"/><text x="563" y="190" class="eyebrow">BUILD + PREVIEW</text><rect x="563" y="220" width="334" height="95" rx="14" fill="#fff" stroke="#a5b4fc"/><text x="588" y="252" class="label">Builder</text><text x="588" y="275" class="small">validate · resolve · bundle</text><text x="588" y="295" class="small">package descriptor + hashes</text><rect x="563" y="344" width="334" height="95" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="588" y="376" class="label">Asset compiler</text><text x="588" y="399" class="small">GLB + mapping sidecar</text><text x="588" y="419" class="small">runtime.morphpack + thumbnail</text><rect x="563" y="468" width="334" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="588" y="500" class="label">Live renderer preview</text><text x="588" y="523" class="small">direct Rust APIs</text><text x="588" y="545" class="small">same shared renderer semantics</text><text x="588" y="567" class="small">current rigid-wearable import slice</text><text x="588" y="589" class="tiny">cross-client package wiring remains open</text>
  <rect x="995" y="157" width="400" height="490" rx="20" fill="#fffaf0" stroke="#f6c453"/><text x="1023" y="190" class="eyebrow">OPTIONAL SERVICE CONNECTIONS</text><rect x="1023" y="235" width="344" height="105" rx="14" fill="#fff" stroke="#f6c453"/><text x="1048" y="268" class="label">Sign in</text><text x="1048" y="291" class="small">browser login → loopback callback</text><text x="1048" y="313" class="small">tokens remain in Studio memory</text><rect x="1023" y="375" width="344" height="105" rx="14" fill="#fff" stroke="#f6c453" stroke-dasharray="7 6"/><text x="1048" y="408" class="label">Share with community</text><text x="1048" y="431" class="small">explicit action · license · review</text><text x="1048" y="453" class="small">target workflow, not a Studio action yet</text><rect x="1023" y="515" width="344" height="93" rx="14" fill="#fff" stroke="#f6c453" stroke-dasharray="7 6"/><text x="1048" y="548" class="label">Backend / catalog</text><text x="1048" y="571" class="small">future publishing + discovery</text><text x="1048" y="591" class="tiny">local import does not use it</text>
  <path d="M465 265H535" class="edge"/><path d="M465 390H535" class="edge"/><path d="M465 530H535" class="edge"/><path d="M730 315V344" class="edge"/><path d="M730 439V468" class="edge"/><path d="M925 285H995" class="edge"/><path d="M925 520H995" class="dashed"/>
  <text x="55" y="706" class="tiny">Design boundary: project source is editable; package and MorphPack outputs are derived; shared Rust owns runtime semantics.</text>
</svg>
