<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 720" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra multiplayer authority paths</title><desc id="desc">The current cooperative path orders and retains client-proposed values in a World Durable Object. The target trusted path adds a validated authority host and authority Luau rules before accepted state is committed and published.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:16px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#c0841a;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="55" y="54" class="eyebrow">ARCHITECTURE / MULTIPLAYER AUTHORITY</text><text x="55" y="90" class="title">Ordered cooperative state today; trusted rules next</text><text x="55" y="118" class="small">The boundary is explicit so a tested prototype is not mistaken for live competitive authority.</text>
  <rect x="55" y="160" width="610" height="440" rx="20" fill="#f8fafc" stroke="#cbd5e1"/><text x="84" y="193" class="eyebrow">CURRENT COOPERATIVE PATH</text><rect x="84" y="245" width="180" height="100" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><text x="174" y="280" text-anchor="middle" class="label">Client</text><text x="174" y="303" text-anchor="middle" class="small">command + input</text><text x="174" y="322" text-anchor="middle" class="small">untrusted values</text><rect x="330" y="245" width="180" height="100" rx="14" fill="#fffaf0" stroke="#f6c453"/><text x="420" y="280" text-anchor="middle" class="label">World DO</text><text x="420" y="303" text-anchor="middle" class="small">identity + order</text><text x="420" y="322" text-anchor="middle" class="small">retained channels</text><rect x="576" y="245" width="60" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="606" y="285" text-anchor="middle" class="label">S</text><text x="606" y="307" text-anchor="middle" class="small">state</text><path d="M264 295H330" class="edge"/><path d="M510 295H576" class="edge"/><text x="84" y="410" class="small">Authoritative for:</text><text x="84" y="436" class="small">identity · ordering · timestamps ·</text><text x="84" y="458" class="small">retained state transport</text><rect x="84" y="500" width="550" height="62" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="359" y="537" text-anchor="middle" class="small">does not prove a game rule was legitimate</text>
  <rect x="735" y="160" width="660" height="440" rx="20" fill="#fffaf0" stroke="#f6c453" stroke-dasharray="8 6"/><text x="764" y="193" class="eyebrow">PROPOSED TRUSTED PATH</text><rect x="764" y="245" width="150" height="100" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/><text x="839" y="280" text-anchor="middle" class="label">Client</text><text x="839" y="303" text-anchor="middle" class="small">command</text><text x="839" y="322" text-anchor="middle" class="small">actor identity</text><rect x="962" y="245" width="150" height="100" rx="14" fill="#fffaf0" stroke="#f6c453"/><text x="1037" y="280" text-anchor="middle" class="label">World DO</text><text x="1037" y="303" text-anchor="middle" class="small">route + order</text><text x="1037" y="322" text-anchor="middle" class="small">trusted facts</text><rect x="1160" y="245" width="205" height="100" rx="14" fill="#fff" stroke="#f6c453"/><text x="1262" y="280" text-anchor="middle" class="label">Authority host</text><text x="1262" y="303" text-anchor="middle" class="small">validate + budget</text><text x="1262" y="322" text-anchor="middle" class="small">execute rules</text><rect x="962" y="410" width="150" height="100" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="1037" y="445" text-anchor="middle" class="label">authority.luau</text><text x="1037" y="468" text-anchor="middle" class="small">game-owned meaning</text><text x="1037" y="487" text-anchor="middle" class="small">accepted events</text><rect x="1160" y="410" width="205" height="100" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="1262" y="445" text-anchor="middle" class="label">Commit + publish</text><text x="1262" y="468" text-anchor="middle" class="small">state + receipts</text><text x="1262" y="487" text-anchor="middle" class="small">back to clients</text><path d="M914 295H962" class="dashed"/><path d="M1112 295H1160" class="dashed"/><path d="M1262 345V410" class="dashed"/><path d="M1160 460H1112" class="dashed"/>
  <text x="55" y="655" class="tiny">Integration still needs pinned package source, authenticated socket identity, atomic persistence, and cross-host verification.</text>
</svg>
