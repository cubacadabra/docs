<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra platform architecture</title>
  <desc id="desc">Creators author JSON, Luau and GLB assets. The build system validates and bundles a portable package consumed by Studio, web, iOS and Android through a shared Rust runtime, with platform services behind host-owned connections.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2937}
      .eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#64748b}
      .title{font-size:30px;font-weight:750;fill:#102a43}
      .sub{font-size:15px;fill:#52606d}
      .label{font-size:16px;font-weight:700}
      .small{font-size:13px;fill:#52606d}
      .tiny{font-size:11px;fill:#627d98}
      .card{stroke-width:1.5}
      .edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}
      .edge-soft{fill:none;stroke:#a0aec0;stroke-width:1.5;stroke-dasharray:6 6;marker-end:url(#arrow)}
      .group{fill:#ffffff;fill-opacity:.74;stroke:#d9e2ec;stroke-width:1.5}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="60" y="56" class="eyebrow">CUBACADABRA / PLATFORM MAP</text>
  <text x="60" y="94" class="title">One package, many hosts, shared semantics</text>
  <text x="60" y="122" class="sub">The creator-facing stack ends in a portable package; hosts provide presentation and platform integration around a shared Rust core.</text>

  <rect x="60" y="155" width="1280" height="138" rx="22" class="group"/>
  <text x="84" y="184" class="eyebrow">CREATOR / SOURCE</text>
  <rect x="84" y="205" width="210" height="61" rx="14" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
  <text x="105" y="232" class="label">Studio</text><text x="105" y="253" class="small">local authoring + preview</text>
  <rect x="320" y="205" width="210" height="61" rx="14" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
  <text x="341" y="232" class="label">Git / files</text><text x="341" y="253" class="small">JSON manifests + source</text>
  <rect x="556" y="205" width="210" height="61" rx="14" fill="#f8fafc" stroke="#cbd5e1" class="card"/>
  <text x="577" y="232" class="label">Luau</text><text x="577" y="253" class="small">game rules + lifecycle</text>
  <rect x="792" y="205" width="210" height="61" rx="14" fill="#f0fdf4" stroke="#86efac" class="card"/>
  <text x="813" y="232" class="label">Blender / GLB</text><text x="813" y="253" class="small">editable asset source</text>
  <rect x="1038" y="205" width="274" height="61" rx="14" fill="#fffbeb" stroke="#f6c453" class="card"/>
  <text x="1060" y="232" class="label">JSON + Luau + GLB</text><text x="1060" y="253" class="small">explicit, reviewable inputs</text>

  <rect x="255" y="330" width="890" height="92" rx="18" fill="#eef2ff" stroke="#a5b4fc" class="card"/>
  <text x="700" y="363" text-anchor="middle" class="eyebrow" fill="#4f46e5">BUILD SYSTEM</text>
  <text x="700" y="389" text-anchor="middle" class="label">validate · resolve dependency graph · bundle SDK · compile assets · hash outputs</text>
  <text x="700" y="410" text-anchor="middle" class="small">The builder is the executable authority for accepted package fields and output behavior.</text>
  <path d="M700 294 V330" class="edge"/>

  <rect x="390" y="462" width="620" height="94" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="700" y="495" text-anchor="middle" class="eyebrow">PORTABLE PACKAGE</text>
  <text x="700" y="521" text-anchor="middle" class="label">manifest · game.luau · assets · package descriptor · SHA-256 map</text>
  <text x="700" y="542" text-anchor="middle" class="small">optional authority.luau is packaged, but current execution remains a prototype</text>
  <path d="M700 422 V462" class="edge"/>

  <rect x="390" y="590" width="620" height="70" rx="17" fill="#eff6ff" stroke="#93c5fd" class="card"/>
  <text x="700" y="618" text-anchor="middle" class="eyebrow">SHARED RUST RUNTIME</text>
  <text x="700" y="642" text-anchor="middle" class="label">engine · client · app state · renderer-facing semantics</text>
  <path d="M700 556 V590" class="edge"/>

  <rect x="60" y="700" width="1280" height="190" rx="22" class="group"/>
  <text x="84" y="729" class="eyebrow">APPLICATION PRODUCTS</text>
  <rect x="84" y="750" width="350" height="112" rx="15" fill="#eef2ff" stroke="#a5b4fc" class="card"/>
  <text x="108" y="779" class="eyebrow">CREATOR APPLICATION</text><text x="108" y="808" class="label">Cubacadabra Studio</text><text x="108" y="833" class="small">macOS · Windows · Linux</text><text x="108" y="850" class="tiny">author · build · preview · test</text>
  <rect x="470" y="750" width="842" height="112" rx="15" fill="#f5f3ff" stroke="#c4b5fd" class="card"/>
  <text x="494" y="779" class="eyebrow">PLAYER APPLICATIONS</text><text x="494" y="808" class="label">Web Player</text><text x="494" y="833" class="small">browser · current</text><text x="690" y="808" class="label">Mobile Players</text><text x="690" y="833" class="small">iOS · Android · current</text><text x="950" y="808" class="label">Desktop Player</text><text x="950" y="833" class="small">macOS · Windows · Linux · planned</text><text x="494" y="850" class="tiny">load catalog/package · account/settings · game sessions · no editor machinery</text>
  <path d="M540 660 V680 H259 V750" class="edge"/><path d="M860 660 V680 H891 V750" class="edge"/>

  <rect x="230" y="930" width="940" height="78" rx="17" fill="#fffaf0" stroke="#f6c453" class="card"/>
  <text x="700" y="958" text-anchor="middle" class="eyebrow">PLATFORM SERVICES / HOST-OWNED CONNECTIONS</text>
  <text x="700" y="984" text-anchor="middle" class="label">Worker edge · Durable Objects · D1 · R2 · identity · catalog · trusted authority (proposed)</text>
  <path d="M700 890 V930" class="edge-soft"/>
  <text x="60" y="1030" class="tiny">Solid = current documented path · dashed = proposed or not yet integrated · Studio and Player are separate products</text>
</svg>
