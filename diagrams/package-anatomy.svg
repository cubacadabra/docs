<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 760" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra package anatomy</title><desc id="desc">A portable package contains manifest metadata, bundled game Luau, optional authority Luau, declared runtime assets, and a package descriptor with hashes. Host loaders verify the descriptor and files before use.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:16px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}
  </style></defs>
  <text x="55" y="54" class="eyebrow">CONTRACTS / PACKAGE FORMAT</text><text x="55" y="90" class="title">A package is a verified handoff, not a mutable folder of guesses</text><text x="55" y="118" class="small">The builder owns accepted fields; hosts validate the complete descriptor and declared content before execution.</text>
  <rect x="55" y="160" width="650" height="500" rx="22" fill="#f8fafc" stroke="#cbd5e1"/><text x="88" y="195" class="eyebrow">cube/package.zip</text>
  <rect x="95" y="225" width="570" height="72" rx="13" fill="#eef2ff" stroke="#a5b4fc"/><text x="120" y="257" class="label">manifest.json</text><text x="120" y="279" class="small">world description · entry metadata · declared assets</text>
  <rect x="95" y="315" width="570" height="92" rx="13" fill="#fff" stroke="#64748b"/><text x="120" y="347" class="label">game.luau</text><text x="120" y="370" class="small">bundled creator modules</text><text x="120" y="390" class="small">bundled Cubacadabra SDK helpers</text>
  <rect x="95" y="425" width="570" height="62" rx="13" fill="#fffaf0" stroke="#f6c453"/><text x="120" y="457" class="label">authority.luau</text><text x="120" y="478" class="small">optional packaged prototype entry</text>
  <rect x="95" y="505" width="570" height="62" rx="13" fill="#f0fdf4" stroke="#86efac"/><text x="120" y="537" class="label">assets/</text><text x="120" y="558" class="small">runtime-declared images · audio · MorphPacks</text>
  <rect x="95" y="585" width="570" height="48" rx="13" fill="#fff" stroke="#94a3b8"/><text x="120" y="615" class="label">package.json</text><text x="360" y="615" class="small">format · SDK · dependency inventory · SHA-256 map</text>
  <rect x="785" y="160" width="410" height="500" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/><text x="818" y="195" class="eyebrow">CONSUMERS</text><rect x="818" y="235" width="344" height="86" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="844" y="269" class="label">Host loader</text><text x="844" y="293" class="small">verify descriptor + all files</text><rect x="818" y="355" width="344" height="86" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="844" y="389" class="label">Shared runtime</text><text x="844" y="413" class="small">load package + execute semantics</text><rect x="818" y="475" width="344" height="86" rx="14" fill="#fff" stroke="#c4b5fd"/><text x="844" y="509" class="label">Release / cache</text><text x="844" y="533" class="small">pin versions and immutable hashes</text><path d="M705 390H785" class="edge"/><path d="M990 321V355" class="edge"/><path d="M990 441V475" class="edge"/>
  <text x="55" y="710" class="tiny">Directory builds preserve the previous successful output when a replacement build fails; directory + ZIP replacement is not one atomic transaction.</text>
</svg>
