<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra compatibility and version stack</title><desc id="desc">Package format, SDK, MorphPack, snapshots, protocol envelopes and UI bounds are separate compatibility axes. Hosts consume the stack only after version and hash checks.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}
  </style></defs>
  <text x="55" y="54" class="eyebrow">COMPATIBILITY / VERSION STACK</text><text x="55" y="90" class="title">Separate axes, explicit rejection, pinned assets</text><text x="55" y="118" class="small">A package version is not an SDK version. Unknown binary schemas and mutable “latest” references are rejected.</text>
  <rect x="55" y="155" width="785" height="495" rx="20" fill="#f8fafc" stroke="#d9e2ec"/><text x="82" y="187" class="eyebrow">CURRENT DOCUMENTED AXES</text>
  <g><rect x="82" y="215" width="690" height="55" rx="12" fill="#eef2ff" stroke="#a5b4fc"/><text x="108" y="248" class="label">Package descriptor</text><text x="370" y="248" class="small">formatVersion 3 · emitted by tools builder</text></g>
  <g><rect x="82" y="287" width="690" height="55" rx="12" fill="#eef2ff" stroke="#a5b4fc"/><text x="108" y="320" class="label">SDK</text><text x="370" y="320" class="small">0.3.0 + 0.4.0 accepted · terrain requires 0.4.0</text></g>
  <g><rect x="82" y="359" width="690" height="55" rx="12" fill="#f0fdf4" stroke="#86efac"/><text x="108" y="392" class="label">MorphPack</text><text x="370" y="392" class="small">schema v5 only · 1–4 reject with explicit error</text></g>
  <g><rect x="82" y="431" width="690" height="55" rx="12" fill="#eff6ff" stroke="#93c5fd"/><text x="108" y="464" class="label">Snapshot</text><text x="370" y="464" class="small">EngineSnapshot v1 · package/script fingerprint</text></g>
  <g><rect x="82" y="503" width="690" height="55" rx="12" fill="#fffaf0" stroke="#f6c453"/><text x="108" y="536" class="label">Remote protocol</text><text x="370" y="536" class="small">envelope v1 · 64 KiB · 17 remote slots</text></g>
  <g><rect x="82" y="575" width="690" height="55" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="108" y="608" class="label">Retained UI</text><text x="370" y="608" class="small">512 nodes · 32 levels · bounded contract</text></g>
  <rect x="900" y="155" width="345" height="495" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/><text x="927" y="187" class="eyebrow">HOST CONSUMPTION</text><rect x="927" y="220" width="291" height="62" rx="13" fill="#fff" stroke="#c4b5fd"/><text x="950" y="247" class="label">Web</text><text x="950" y="268" class="small">WASM + JavaScript</text><rect x="927" y="308" width="291" height="62" rx="13" fill="#fff" stroke="#c4b5fd"/><text x="950" y="335" class="label">iOS / Android</text><text x="950" y="356" class="small">native bridges + loaders</text><rect x="927" y="396" width="291" height="62" rx="13" fill="#fff" stroke="#c4b5fd"/><text x="950" y="423" class="label">Studio</text><text x="950" y="444" class="small">direct Rust preview path</text><rect x="927" y="498" width="291" height="107" rx="13" fill="#fff" stroke="#c4b5fd"/><text x="950" y="529" class="label">Before execution</text><text x="950" y="552" class="small">check version + hashes</text><text x="950" y="574" class="small">pin immutable assets</text><text x="950" y="596" class="small">reject unknown values</text>
  <path d="M840 380H900" class="edge"/>
  <text x="55" y="700" class="tiny">This is a checked-out compatibility snapshot; release support requires real host verification for the exact artifact.</text>
</svg>
