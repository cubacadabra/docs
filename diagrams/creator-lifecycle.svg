<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra creator lifecycle</title><desc id="desc">Creators create a local project, author and preview, test, build a portable package, publish an immutable release through an explicit action, and players load the pinned result.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2.2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#c0841a;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="50" y="52" class="eyebrow">PRODUCT / CREATOR JOURNEY</text><text x="50" y="88" class="title">Create once, validate locally, publish deliberately, play the pinned release</text><text x="50" y="116" class="small">The package is the handoff between authoring and every host.</text>
  <g><rect x="50" y="190" width="190" height="124" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="75" y="226" class="eyebrow">01</text><text x="75" y="254" class="label">Create</text><text x="75" y="278" class="small">New Project</text><text x="75" y="297" class="small">local repository</text></g>
  <g><rect x="315" y="190" width="190" height="124" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="340" y="226" class="eyebrow">02</text><text x="340" y="254" class="label">Author</text><text x="340" y="278" class="small">JSON · Luau · GLB</text><text x="340" y="297" class="small">source stays editable</text></g>
  <g><rect x="580" y="190" width="190" height="124" rx="16" fill="#eef2ff" stroke="#a5b4fc"/><text x="605" y="226" class="eyebrow">03</text><text x="605" y="254" class="label">Preview + test</text><text x="605" y="278" class="small">Studio · headless</text><text x="605" y="297" class="small">host evidence grows here</text></g>
  <g><rect x="845" y="190" width="190" height="124" rx="16" fill="#eef2ff" stroke="#a5b4fc"/><text x="870" y="226" class="eyebrow">04</text><text x="870" y="254" class="label">Build</text><text x="870" y="278" class="small">validate + bundle</text><text x="870" y="297" class="small">package + hashes</text></g>
  <g><rect x="1110" y="190" width="190" height="124" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="1135" y="226" class="eyebrow">05</text><text x="1135" y="254" class="label">Publish</text><text x="1135" y="278" class="small">explicit review</text><text x="1135" y="297" class="small">immutable release</text></g>
  <g><rect x="1340" y="190" width="120" height="124" rx="16" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1400" y="226" text-anchor="middle" class="eyebrow">06</text><text x="1400" y="254" text-anchor="middle" class="label">Play</text><text x="1400" y="278" text-anchor="middle" class="small">pinned</text><text x="1400" y="297" text-anchor="middle" class="small">package</text></g>
  <path d="M240 252H315" class="edge"/><path d="M505 252H580" class="edge"/><path d="M770 252H845" class="edge"/><path d="M1035 252H1110" class="edge"/><path d="M1300 252H1340" class="edge"/>
  <rect x="180" y="385" width="1140" height="80" rx="16" fill="#fff" stroke="#d9e2ec"/><text x="750" y="417" text-anchor="middle" class="eyebrow">LOOP</text><text x="750" y="444" text-anchor="middle" class="label">source change → rebuild → verify → publish a new immutable version</text>
  <path d="M400 314V355H750V385" class="dashed"/><path d="M750 465V500H400V314" class="dashed"/>
  <text x="50" y="520" class="tiny">Community publishing is an explicit target workflow; current local import and preview do not require authentication.</text>
</svg>
