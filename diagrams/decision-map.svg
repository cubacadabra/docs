<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra architecture decision map</title><desc id="desc">Four accepted decisions constrain authored content, game rules, portable runtime semantics, and documentation ownership.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:16px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}
  </style></defs>
  <text x="55" y="54" class="eyebrow">DECISIONS / ARCHITECTURE CONSTRAINTS</text><text x="55" y="90" class="title">Four decisions keep the platform coherent</text><text x="55" y="118" class="small">Accepted records constrain future implementation without pretending every proposed path is already integrated.</text>
  <rect x="490" y="260" width="320" height="128" rx="20" fill="#102a43" stroke="#102a43"/><text x="650" y="302" text-anchor="middle" class="eyebrow" fill="#bfdbfe">CUBACADABRA</text><text x="650" y="337" text-anchor="middle" font-size="23" font-weight="750" fill="#fff">platform boundary</text><text x="650" y="362" text-anchor="middle" class="small" fill="#d9e2ec">generic core · creator rules · host edges</text>
  <rect x="55" y="170" width="330" height="180" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="82" y="204" class="eyebrow">0001 / JSON CONTENT</text><text x="82" y="244" class="label">Keep authored descriptions inspectable</text><text x="82" y="273" class="small">JSON for manifests and world data.</text><text x="82" y="294" class="small">Binary formats only where runtime data</text><text x="82" y="315" class="small">justifies them, such as MorphPack.</text>
  <rect x="915" y="170" width="330" height="180" rx="18" fill="#f0fdf4" stroke="#86efac"/><text x="942" y="204" class="eyebrow">0002 / LUAU RULES</text><text x="942" y="244" class="label">Keep game-specific meaning in Luau</text><text x="942" y="273" class="small">Rust supplies generic facts, commands,</text><text x="942" y="294" class="small">events and budgets. Games define</text><text x="942" y="315" class="small">what a validated action means.</text>
  <rect x="55" y="470" width="330" height="180" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="82" y="504" class="eyebrow">0003 / SHARED RUST</text><text x="82" y="544" class="label">Share semantics where hosts need parity</text><text x="82" y="573" class="small">Native, web and Studio share runtime</text><text x="82" y="594" class="small">decisions; hosts keep UI, transport,</text><text x="82" y="615" class="small">OS and accessibility behavior.</text>
  <rect x="915" y="470" width="330" height="180" rx="18" fill="#fffaf0" stroke="#f6c453"/><text x="942" y="504" class="eyebrow">0004 / CANONICAL DOCS</text><text x="942" y="544" class="label">Keep cross-repo contracts in docs</text><text x="942" y="573" class="small">Implementation repos keep tests and</text><text x="942" y="594" class="small">operational notes; this repo owns the</text><text x="942" y="615" class="small">hand-written public contract.</text>
  <path d="M385 260H490" class="edge"/><path d="M915 260H810" class="edge"/><path d="M385 560H490" class="edge"/><path d="M915 560H810" class="edge"/>
  <text x="55" y="692" class="tiny">See each ADR for status, rationale and consequences; status outranks the presence of a prototype.</text>
</svg>
