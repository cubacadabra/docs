<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra verification matrix</title><desc id="desc">A transparent verification matrix maps contract areas to Rust, Web, iOS, Android, Studio and Release evidence using verified, partial, required and not-applicable states.</desc>
  <defs><style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:29px;font-weight:750;fill:#102a43}.label{font-size:14px;font-weight:700}.small{font-size:12px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.head{font-size:13px;font-weight:700;fill:#334e68}.cell{font-size:20px;font-weight:800}.line{stroke:#d9e2ec;stroke-width:1}.v{fill:#dcfce7;stroke:#86efac}.p{fill:#fef3c7;stroke:#f6c453}.r{fill:#fee2e2;stroke:#fca5a5}.na{fill:#f1f5f9;stroke:#cbd5e1}
  </style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="55" y="52" class="eyebrow">VERIFICATION / EVIDENCE BOUNDARIES</text><text x="55" y="89" class="title">What each layer of evidence actually proves</text><text x="55" y="117" class="small">Current checked-in documentation status; compile checks are not device execution, and prototypes are not release evidence.</text>
