<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra SDK layering map</title><desc id="desc">Generic engine and lifecycle primitives form the bottom of the SDK. Reusable Luau helpers layer above them, while creator games compose those helpers and their own rules into a bundled package.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
  text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.7px;fill:#64748b}.title{font-size:27px;font-weight:750;fill:#102a43}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}
  </style></defs>
  <text x="55" y="53" class="eyebrow">CONTRACTS / SDK</text><text x="55" y="88" class="title">Reusable Luau helpers above generic runtime seams</text><text x="55" y="116" class="small">SDK modules are bundled into game.luau; they do not turn game-specific concepts into Rust engine APIs.</text>
  <rect x="55" y="155" width="1090" height="105" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="82" y="187" class="eyebrow">RUNTIME PRIMITIVES</text><rect x="82" y="205" width="200" height="34" rx="9" fill="#fff" stroke="#bfdbfe"/><text x="182" y="227" text-anchor="middle" class="small">state + snapshots</text><rect x="302" y="205" width="200" height="34" rx="9" fill="#fff" stroke="#bfdbfe"/><text x="402" y="227" text-anchor="middle" class="small">events + lifecycle</text><rect x="522" y="205" width="200" height="34" rx="9" fill="#fff" stroke="#bfdbfe"/><text x="622" y="227" text-anchor="middle" class="small">network + tasks</text><rect x="742" y="205" width="200" height="34" rx="9" fill="#fff" stroke="#bfdbfe"/><text x="842" y="227" text-anchor="middle" class="small">bounded UI + effects</text><text x="976" y="224" class="tiny">engine-owned</text>
  <rect x="55" y="300" width="1090" height="105" rx="18" fill="#f0fdf4" stroke="#86efac"/><text x="82" y="332" class="eyebrow">SHARED SDK MODULES</text><rect x="82" y="350" width="200" height="34" rx="9" fill="#fff" stroke="#86efac"/><text x="182" y="372" text-anchor="middle" class="small">shared-state</text><rect x="302" y="350" width="200" height="34" rx="9" fill="#fff" stroke="#86efac"/><text x="402" y="372" text-anchor="middle" class="small">obby</text><rect x="522" y="350" width="200" height="34" rx="9" fill="#fff" stroke="#86efac"/><text x="622" y="372" text-anchor="middle" class="small">survival</text><rect x="742" y="350" width="200" height="34" rx="9" fill="#fff" stroke="#86efac"/><text x="842" y="372" text-anchor="middle" class="small">disclosure + cycle</text><text x="976" y="369" class="tiny">versioned helpers</text>
  <rect x="55" y="445" width="1090" height="105" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="82" y="477" class="eyebrow">CREATOR PACKAGE</text><text x="82" y="516" class="label">Game rules + SDK modules + manifest</text><text x="520" y="516" class="small">Creators compose reusable contracts and define game-specific meaning in Luau.</text><rect x="951" y="484" width="160" height="39" rx="10" fill="#fff" stroke="#64748b"/><text x="1031" y="508" text-anchor="middle" class="small">game.luau</text>
  <path d="M600 260V300" class="edge"/><path d="M600 405V445" class="edge"/>
</svg>
