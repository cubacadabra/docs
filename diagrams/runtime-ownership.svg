<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 880" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra runtime ownership architecture</title>
  <desc id="desc">Host presentation sits above C ABI, JNI, WASM, and direct Rust adapters. Shared Rust contains application, client, and engine layers. Platform services sit below the host-owned transport boundary.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718096"/></marker><style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:#1f2937}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.8px;fill:#64748b}.title{font-size:28px;font-weight:750;fill:#102a43}.label{font-size:16px;font-weight:700}.small{font-size:13px;fill:#52606d}.tiny{font-size:11px;fill:#627d98}.edge{fill:none;stroke:#718096;stroke-width:2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#c0841a;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="55" y="54" class="eyebrow">ARCHITECTURE / OWNERSHIP</text><text x="55" y="91" class="title">Shared semantics, explicit host boundaries</text><text x="55" y="119" class="small">Host UI, credentials, transport and OS APIs remain outside the portable Rust layers.</text>
  <rect x="55" y="150" width="1190" height="142" rx="20" fill="#f5f3ff" stroke="#c4b5fd"/><text x="80" y="180" class="eyebrow">HOST PRESENTATION</text>
  <rect x="80" y="202" width="225" height="57" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="102" y="227" class="label">SwiftUI</text><text x="102" y="247" class="small">Apple APIs + lifecycle</text>
  <rect x="335" y="202" width="225" height="57" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="357" y="227" class="label">Compose</text><text x="357" y="247" class="small">Android APIs + lifecycle</text>
  <rect x="590" y="202" width="225" height="57" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="612" y="227" class="label">DOM / JavaScript</text><text x="612" y="247" class="small">browser presentation</text>
  <rect x="845" y="202" width="225" height="57" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="867" y="227" class="label">Studio / egui</text><text x="867" y="247" class="small">desktop editor shell</text>
  <rect x="1100" y="202" width="120" height="57" rx="12" fill="#fff" stroke="#c4b5fd"/><text x="1160" y="227" text-anchor="middle" class="label">OS</text><text x="1160" y="247" text-anchor="middle" class="small">device APIs</text>
  <rect x="55" y="330" width="1190" height="350" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="80" y="360" class="eyebrow">SHARED RUST</text>
  <rect x="85" y="391" width="340" height="235" rx="16" fill="#fff" stroke="#93c5fd"/><text x="115" y="427" class="label">cubacadabra-app</text><text x="115" y="454" class="small">account · profile · catalog</text><text x="115" y="476" class="small">product state · safety state</text><path d="M115 500H390" stroke="#dbeafe"/><text x="115" y="531" class="tiny">portable application decisions</text><text x="115" y="555" class="tiny">host projects actions + effects</text>
  <rect x="480" y="391" width="340" height="235" rx="16" fill="#fff" stroke="#93c5fd"/><text x="510" y="427" class="label">cubacadabra-client</text><text x="510" y="454" class="small">session · routing · protocol</text><text x="510" y="476" class="small">remote actors · cache / load</text><path d="M510 500H785" stroke="#dbeafe"/><text x="510" y="531" class="tiny">active game session behavior</text><text x="510" y="555" class="tiny">host supplies transport</text>
  <rect x="875" y="391" width="340" height="235" rx="16" fill="#fff" stroke="#93c5fd"/><text x="905" y="427" class="label">cubacadabra-engine</text><text x="905" y="454" class="small">Luau · world · physics</text><text x="905" y="476" class="small">DataModel · rendering-facing data</text><path d="M905 500H1180" stroke="#dbeafe"/><text x="905" y="531" class="tiny">generic runtime semantics</text><text x="905" y="555" class="tiny">game rules stay in Luau</text>
  <path d="M192 292V330" class="edge"/><path d="M447 292V330" class="edge"/><path d="M702 292V330" class="edge"/><path d="M957 292V330" class="edge"/>
  <path d="M255 391V370H702V391" class="edge"/><path d="M650 391V370H1045V391" class="edge"/>
  <rect x="200" y="720" width="900" height="82" rx="16" fill="#fffaf0" stroke="#f6c453"/><text x="650" y="749" text-anchor="middle" class="eyebrow">PLATFORM BOUNDARY</text><text x="650" y="776" text-anchor="middle" class="label">Worker · Durable Object · D1 · R2 · authenticated transport</text><path d="M650 680V720" class="dashed"/>
  <text x="55" y="844" class="tiny">C ABI = iOS / Android boundary · WASM = browser boundary · direct Rust = Studio boundary</text>
</svg>
