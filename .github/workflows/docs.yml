name: Documentation checks

on:
  push:
    tags:
      - "docs-check-*"

permissions:
  contents: read

jobs:
  links-and-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate documentation links and status
        run: python scripts/check_docs.py
