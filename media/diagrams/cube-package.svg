<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra Cube package anatomy</title><desc id="desc">A portable Cubacadabra package contains a manifest, Luau rules, assets, and integrity metadata, built as one immutable artifact for hosts to validate.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090c19"/><stop offset="1" stop-color="#1b1430"/></linearGradient><linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9a7b"/><stop offset="1" stop-color="#ff5e6d"/></linearGradient><linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6b4bd4"/><stop offset="1" stop-color="#3a2a83"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1500" height="820" rx="32" fill="url(#bg)"/><text x="72" y="76" fill="#ff846d" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">CONTRACTS / PACKAGE</text><text x="72" y="122" fill="#f7f7fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">A game travels as a Cube.</text><text x="72" y="153" fill="#a9afd0" font-family="Inter,Arial,sans-serif" font-size="17">One immutable artifact, explicit contents, verifiable bytes.</text>
  <g transform="translate(545 245)" filter="url(#shadow)"><path d="M210 0L470 136L210 272L0 136Z" fill="url(#top)"/><path d="M0 136L210 272V574L0 438Z" fill="#c84c67"/><path d="M210 272L470 136V438L210 574Z" fill="url(#side)"/><path d="M210 0V272M0 136L210 272L470 136" fill="none" stroke="#ffe2d9" stroke-width="3" opacity=".8"/><g font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff"><text x="94" y="138" transform="rotate(30 94 138)">manifest.json</text><text x="45" y="318" transform="rotate(33 45 318)">game.luau</text><text x="266" y="337" transform="rotate(-27 266 337)">assets/</text><text x="279" y="398" transform="rotate(-27 279 398)" fill="#d8cdfd">SHA-256</text></g><path d="M112 45L192 86L123 122L51 85Z" fill="#fff" opacity=".18"/></g>
<g font-family="Inter,Arial,sans-serif"><path d="M470 293H300" fill="none" stroke="#ff836f" stroke-width="2"/><circle cx="470" cy="293" r="5" fill="#ff836f"/><text x="150" y="218" fill="#ffb19e" font-size="13" font-weight="700" letter-spacing="1.5">DECLARATION</text><text x="150" y="246" fill="#f5f3fb" font-size="18" font-weight="650">manifest.json</text><text x="150" y="273" fill="#aeb4d2" font-size="14">package identity, SDK, world, limits</text><path d="M545 550H300" fill="none" stroke="#ff836f" stroke-width="2"/><circle cx="545" cy="550" r="5" fill="#ff836f"/><text x="150" y="575" fill="#ffb19e" font-size="13" font-weight="700" letter-spacing="1.5">RULES</text><text x="150" y="603" fill="#f5f3fb" font-size="18" font-weight="650">Luau source + generated entry</text><text x="150" y="630" fill="#aeb4d2" font-size="14">game-owned behavior, kept out of the engine</text><path d="M1015 351H1200" fill="none" stroke="#9b82f1" stroke-width="2"/><circle cx="1015" cy="351" r="5" fill="#9b82f1"/><text x="1350" y="274" text-anchor="end" fill="#bcaeff" font-size="13" font-weight="700" letter-spacing="1.5">CONTENT</text><text x="1350" y="302" text-anchor="end" fill="#f5f3fb" font-size="18" font-weight="650">assets/</text><text x="1350" y="329" text-anchor="end" fill="#aeb4d2" font-size="14">images, MorphPacks, audio, world data</text><path d="M1015 546H1200" fill="none" stroke="#9b82f1" stroke-width="2"/><circle cx="1015" cy="546" r="5" fill="#9b82f1"/><text x="1350" y="575" text-anchor="end" fill="#bcaeff" font-size="13" font-weight="700" letter-spacing="1.5">INTEGRITY</text><text x="1350" y="603" text-anchor="end" fill="#f5f3fb" font-size="18" font-weight="650">hash map + exact revision</text><text x="1350" y="630" text-anchor="end" fill="#aeb4d2" font-size="14">hosts reject incomplete or unknown artifacts</text></g>
  <text x="750" y="752" text-anchor="middle" fill="#7781ac" font-family="Inter,Arial,sans-serif" font-size="13">Orientation only; the normative byte layout lives in the package and MorphPack contracts.</text>
</svg>
