<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra Cube package anatomy</title>
  <desc id="desc">A Cube encloses a manifest, game rules, declared assets, and an integrity map as one immutable package that hosts validate before loading.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d16"/><stop offset=".56" stop-color="#0e1524"/><stop offset="1" stop-color="#17142d"/></linearGradient>
    <linearGradient id="workspace" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151d2c"/><stop offset="1" stop-color="#0c121f"/></linearGradient>
    <linearGradient id="manifest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffa184"/><stop offset="1" stop-color="#ff6671"/></linearGradient>
    <linearGradient id="rules" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e86b82"/><stop offset="1" stop-color="#bd4769"/></linearGradient>
    <linearGradient id="assets" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a71ec"/><stop offset="1" stop-color="#5f46bf"/></linearGradient>
    <linearGradient id="hashes" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#668cf2"/><stop offset="1" stop-color="#3e58aa"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7668ed" stop-opacity=".35"/><stop offset=".56" stop-color="#ff6a6f" stop-opacity=".1"/><stop offset="1" stop-color="#111827" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".52"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Inter,Arial,sans-serif}.eyebrow{fill:#ff8975;font-size:15px;font-weight:700;letter-spacing:2.8px}.headline{fill:#f7f8fc;font-size:37px;font-weight:750;letter-spacing:-.5px}.deck{fill:#aeb7cb;font-size:18px}.kicker{font-size:14px;font-weight:700;letter-spacing:2px}.name{fill:#fff;font-size:19px;font-weight:700}.note{fill:#9ea9bf;font-size:14px}.face{fill:#fff;font-size:16px;font-weight:700}.footer{fill:#b8c1d5;font-size:14px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <g transform="translate(60 54)"><path d="M0 11L11 0L22 11L11 22Z" fill="none" stroke="#ff7868" stroke-width="3"/><path d="M7 7L15 15M15 7L7 15" stroke="#ff7868" stroke-width="2.5" stroke-linecap="round"/><text x="40" y="17" class="eyebrow">CONTRACTS / PACKAGE</text></g>
  <text x="60" y="117" class="headline">The whole game travels together.</text>
  <text x="60" y="149" class="deck">One immutable Cube. Four explicit layers. No mutable surprises.</text>

  <rect x="46" y="177" width="1108" height="480" rx="28" fill="url(#workspace)" stroke="#293348" stroke-width="2" filter="url(#shadow)"/>
  <path d="M46 226H1154" stroke="#2c364b"/>
  <g transform="translate(70 195)"><circle cx="0" cy="7" r="5" fill="#ff7e6d"/><circle cx="20" cy="7" r="5" fill="#f0b36c"/><circle cx="40" cy="7" r="5" fill="#6f8fff"/><text x="70" y="13" class="note">PACKAGE INSPECTOR</text></g>

  <g transform="translate(78 258)">
    <text class="kicker" fill="#9eb0ff">CUBE CONTENTS</text>
    <g transform="translate(0 42)"><rect width="310" height="62" rx="12" fill="#182132" stroke="#364258"/><rect width="6" height="62" rx="3" fill="#ff806d"/><text x="24" y="27" class="name">manifest.json</text><text x="24" y="49" class="note">identity · SDK · world · limits</text></g>
    <g transform="translate(0 116)"><rect width="310" height="62" rx="12" fill="#182132" stroke="#364258"/><rect width="6" height="62" rx="3" fill="#d65776"/><text x="24" y="27" class="name">game.luau</text><text x="24" y="49" class="note">game-owned rules</text></g>
    <g transform="translate(0 190)"><rect width="310" height="62" rx="12" fill="#182132" stroke="#364258"/><rect width="6" height="62" rx="3" fill="#8268e1"/><text x="24" y="27" class="name">assets/</text><text x="24" y="49" class="note">models · images · audio · world data</text></g>
    <g transform="translate(0 264)"><rect width="310" height="62" rx="12" fill="#182132" stroke="#364258"/><rect width="6" height="62" rx="3" fill="#668cf2"/><text x="24" y="27" class="name">SHA-256 map</text><text x="24" y="49" class="note">exact files · exact revision</text></g>
  </g>

  <g transform="translate(465 238) scale(.82)">
    <circle cx="302" cy="205" r="270" fill="url(#halo)"/>
    <ellipse cx="302" cy="358" rx="250" ry="46" fill="#050810" opacity=".72"/><ellipse cx="302" cy="344" rx="196" ry="30" fill="#6d72e8" opacity=".18"/>
    <g filter="url(#shadow)">
      <g transform="translate(0 0)"><path d="M302 0L493 92L302 184L111 92Z" fill="url(#manifest)"/><path d="M111 92L302 184V204L111 112Z" fill="#c94d68"/><path d="M302 184L493 92V112L302 204Z" fill="#714fd3"/><text x="302" y="72" text-anchor="middle" class="face">MANIFEST</text></g>
      <g transform="translate(0 94)"><path d="M302 0L493 92L302 184L111 92Z" fill="url(#rules)"/><path d="M111 92L302 184V204L111 112Z" fill="#9e3558"/><path d="M302 184L493 92V112L302 204Z" fill="#5c3d9c"/><text x="302" y="72" text-anchor="middle" class="face">RULES</text></g>
      <g transform="translate(0 188)"><path d="M302 0L493 92L302 184L111 92Z" fill="url(#assets)"/><path d="M111 92L302 184V204L111 112Z" fill="#5440a3"/><path d="M302 184L493 92V112L302 204Z" fill="#3f347b"/><text x="302" y="72" text-anchor="middle" class="face">ASSETS</text></g>
      <g transform="translate(0 282)"><path d="M302 0L493 92L302 184L111 92Z" fill="url(#hashes)"/><path d="M111 92L302 184V204L111 112Z" fill="#385199"/><path d="M302 184L493 92V112L302 204Z" fill="#2d3d75"/><text x="302" y="72" text-anchor="middle" class="face">INTEGRITY</text></g>
    </g>
    <g fill="none" stroke="#afbbde" stroke-opacity=".28" stroke-width="2"><path d="M111 92V374L302 466L493 374V92"/><path d="M302 184V466"/></g>
  </g>

  <g transform="translate(78 606)"><circle cx="7" cy="0" r="7" fill="#54d17a"/><text x="24" y="5" class="footer">HOSTS VALIDATE THE COMPLETE CUBE BEFORE LOADING IT</text></g>
</svg>
