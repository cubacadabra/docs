  <path d="M930 418C964 418 976 374 1010 374" fill="none" stroke="#ff816e" stroke-width="3" marker-end="url(#arrow)"/><text x="938" y="385" fill="#ffac9c" class="muted" font-weight="600">load + render</text>
  <g transform="translate(424 670)"><rect width="752" height="102" rx="24" fill="#121d43" stroke="#4c70d4" stroke-width="2"/><rect x="20" y="20" width="8" height="62" rx="4" fill="#ff816e"/><text x="52" y="48" fill="#f3f5ff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Rust runtime</text><text x="52" y="73" fill="#aeb8e2" font-family="Inter,Arial,sans-serif" font-size="14">simulation · Luau · renderer · client session · app state</text><text x="545" y="53" fill="#8198ef" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">SHARED SEMANTICS</text><text x="545" y="75" fill="#9da8ce" font-family="Inter,Arial,sans-serif" font-size="13">same package, same rules</text></g>
  <path d="M790 640V588" fill="none" stroke="#6279d8" stroke-width="2" stroke-dasharray="5 7"/><path d="M1120 670C1240 635 1370 635 1490 670" fill="none" stroke="#f1af68" stroke-width="2" stroke-dasharray="7 8" opacity=".75"/>
  <g transform="translate(74 830)"><circle cx="16" cy="12" r="9" fill="#f1af68"/><text x="42" y="18" fill="#f6d3a0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">PLATFORM SERVICES</text><text x="247" y="18" fill="#aeb3d1" font-family="Inter,Arial,sans-serif" font-size="14">live worlds · auth · publishing · durable records · moderation</text></g><text x="1510" y="890" text-anchor="end" fill="#737ca8" font-family="Inter,Arial,sans-serif" font-size="12">orientation map / see canonical contracts for exact behavior</text>
</svg>
