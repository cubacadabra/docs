<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra platform overview</title>
  <desc id="desc">Studio turns authored content into a portable Cube package. The shared Rust runtime opens that package across browser, phone, and desktop hosts while backend services coordinate live worlds and durable records.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset=".52" stop-color="#11152d"/><stop offset="1" stop-color="#1a1230"/></linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8d70"/><stop offset=".48" stop-color="#ff5b6e"/><stop offset="1" stop-color="#7147e8"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ff836f"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif}.eyebrow{fill:#ff846d;font-size:16px;font-weight:700;letter-spacing:3px}.title{fill:#f7f7fb;font-size:34px;font-weight:750}.sub{fill:#a9afd0;font-size:17px}.label{fill:#fff;font-size:15px;font-weight:700}.muted{fill:#9299bd;font-size:13px}.small{fill:#c4c9e1;font-size:13px}</style>
  </defs>
  <rect width="1600" height="940" rx="34" fill="url(#bg)"/><circle cx="750" cy="420" r="250" fill="#ff5c6c" opacity=".08" filter="url(#soft)"/><circle cx="1240" cy="250" r="230" fill="#5b5ee9" opacity=".1" filter="url(#soft)"/><g fill="#fff" opacity=".45"><circle cx="74" cy="92" r="2"/><circle cx="250" cy="170" r="2"/><circle cx="1400" cy="110" r="2"/><circle cx="1510" cy="710" r="2"/><circle cx="1080" cy="70" r="1.5"/><circle cx="530" cy="760" r="1.5"/></g>
  <text x="74" y="78" class="eyebrow">CUBACADABRA / PLATFORM</text><text x="74" y="126" class="title">One package. Every host.</text><text x="74" y="158" class="sub">Studio authors the world; the Cube carries it; Player makes it real.</text>
  <g transform="translate(74 264)"><text y="-24" class="label">STUDIO</text><text y="2" class="muted">creator workspace</text><rect y="28" width="390" height="250" rx="20" fill="#171d38" stroke="#424b77" stroke-width="2"/><rect x="18" y="47" width="354" height="174" rx="12" fill="#0c1124"/><path d="M18 178L93 130L166 164L230 105L372 178V221H18Z" fill="#263c62"/><path d="M18 194L118 158L207 194L292 146L372 188V221H18Z" fill="#314e64"/><path d="M57 180L112 135L166 166L226 112" fill="none" stroke="#ff806d" stroke-width="4" stroke-linecap="round"/><circle cx="112" cy="135" r="8" fill="#ff806d" filter="url(#glow)"/><rect x="18" y="236" width="104" height="7" rx="4" fill="#ff806d"/><rect x="135" y="236" width="74" height="7" rx="4" fill="#5569c8"/><rect x="222" y="236" width="126" height="7" rx="4" fill="#344268"/><text x="18" y="306" class="small">JSON  ·  Luau  ·  GLB</text></g>
  <path d="M480 418C555 418 559 418 622 418" fill="none" stroke="#ff816e" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="391" fill="#ffac9c" class="muted" font-weight="600">validate + build</text>
  <g transform="translate(660 270)"><text x="44" y="-24" class="label">THE CUBE</text><text x="44" y="2" class="muted">portable, hashed package</text><path d="M118 54L256 126L118 198L0 126Z" fill="url(#cube)"/><path d="M0 126L118 198V370L0 298Z" fill="#d64f65"/><path d="M118 198L256 126V298L118 370Z" fill="#704ad1"/><path d="M118 54V198M0 126L118 198L256 126" fill="none" stroke="#ffe0d7" stroke-width="2" opacity=".8"/><path d="M23 138L107 187V321L23 270Z" fill="#f2776d" opacity=".35"/><path d="M138 211L232 160V278L138 329Z" fill="#a085f1" opacity=".35"/><rect x="36" y="100" width="84" height="28" rx="14" transform="rotate(30 36 100)" fill="#fff" opacity=".95"/><text x="44" y="397" class="small">manifest · assets · rules · hashes</text></g>
