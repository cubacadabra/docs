<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra repository constellation</title>
  <desc id="desc">The Cubacadabra codebase is grouped into creator tools, shared core, host clients, services, content, and documentation rather than treated as separate product silos.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset="1" stop-color="#19142d"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="20"/></filter><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1500" height="820" rx="32" fill="url(#bg)"/><circle cx="755" cy="390" r="235" fill="#ff5f6f" opacity=".09" filter="url(#blur)"/><circle cx="370" cy="220" r="180" fill="#4d74e8" opacity=".1" filter="url(#blur)"/>
  <g stroke="#455282" stroke-width="2" opacity=".7"><path d="M294 231C475 273 527 329 631 371"/><path d="M294 593C470 557 532 489 631 434"/><path d="M1205 230C1040 267 975 326 870 372"/><path d="M1205 592C1041 554 977 492 870 436"/><path d="M751 604V703"/><path d="M751 214V310"/></g>
  <text x="72" y="76" fill="#ff846d" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">CODEBASE / OWNERSHIP</text><text x="72" y="122" fill="#f7f7fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">One system, many repositories.</text><text x="72" y="153" fill="#a9afd0" font-family="Inter,Arial,sans-serif" font-size="17">Follow the responsibility, then open the repository.</text>
  <g transform="translate(630 310)"><circle cx="120" cy="120" r="116" fill="#172453" stroke="#ff776d" stroke-width="3" filter="url(#glow)"/><path d="M120 34L188 70L120 106L61 70Z" fill="#ff816e"/><path d="M61 70L120 106V187L61 151Z" fill="#c64c69"/><path d="M120 106L188 70V151L120 187Z" fill="#7051d7"/><text x="120" y="229" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Cubacadabra</text><text x="120" y="252" text-anchor="middle" fill="#aeb8e2" font-family="Inter,Arial,sans-serif" font-size="13">shared contracts + docs</text></g>
  <g transform="translate(72 190)" font-family="Inter,Arial,sans-serif"><text fill="#ffb0a0" font-size="13" font-weight="700" letter-spacing="2">CREATOR</text><text y="26" fill="#fff" font-size="21" font-weight="700">make</text><g transform="translate(0 53)"><circle cx="10" cy="10" r="10" fill="#ff816e"/><text x="30" y="15" fill="#d9dbeb" font-size="16">studio</text></g><g transform="translate(0 91)"><circle cx="10" cy="10" r="10" fill="#ff816e" opacity=".75"/><text x="30" y="15" fill="#d9dbeb" font-size="16">tools</text></g><g transform="translate(0 129)"><circle cx="10" cy="10" r="10" fill="#ff816e" opacity=".5"/><text x="30" y="15" fill="#d9dbeb" font-size="16">examples</text></g></g>
  <g transform="translate(72 562)" font-family="Inter,Arial,sans-serif"><text fill="#ffb0a0" font-size="13" font-weight="700" letter-spacing="2">CONTENT</text><text y="26" fill="#fff" font-size="21" font-weight="700">ship worlds</text><text y="67" fill="#d9dbeb" font-size="16">first-game · second-game · third-game</text></g>
  <g transform="translate(1205 190)" font-family="Inter,Arial,sans-serif"><text fill="#a9b9ff" font-size="13" font-weight="700" letter-spacing="2">HOSTS</text><text y="26" fill="#fff" font-size="21" font-weight="700">play</text><text y="79" fill="#d9dbeb" font-size="16">web</text><text y="117" fill="#d9dbeb" font-size="16">ios_app</text><text y="155" fill="#d9dbeb" font-size="16">android_app</text><text y="193" fill="#d9dbeb" font-size="16">desktop</text></g>
  <g transform="translate(1205 562)" font-family="Inter,Arial,sans-serif"><text fill="#e7bc7c" font-size="13" font-weight="700" letter-spacing="2">SERVICES</text><text y="26" fill="#fff" font-size="21" font-weight="700">coordinate</text><text y="67" fill="#d9dbeb" font-size="16">backend · developer</text></g>
  <g transform="translate(545 705)" font-family="Inter,Arial,sans-serif"><rect width="410" height="58" rx="29" fill="#141d42" stroke="#5269c8" stroke-width="2"/><circle cx="30" cy="29" r="8" fill="#7e9cff"/><text x="52" y="35" fill="#e4e7f7" font-size="16" font-weight="600">rust</text><text x="114" y="35" fill="#aeb8e2" font-size="15">the shared foundation</text></g>
</svg>
