<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra repository constellation</title>
  <desc id="desc">Creator tools, Player hosts, services, games, shared Rust, and documentation connect through one Cubacadabra contract hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d16"/><stop offset=".52" stop-color="#0d1422"/><stop offset="1" stop-color="#15132a"/></linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#151d2c" stop-opacity=".94"/><stop offset="1" stop-color="#0d1220" stop-opacity=".96"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9b7a"/><stop offset="1" stop-color="#ff5f6e"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7895ff"/><stop offset="1" stop-color="#7652e6"/></linearGradient>
    <linearGradient id="foundation" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#26385f" stop-opacity="0"/><stop offset=".13" stop-color="#31599d"/><stop offset=".5" stop-color="#697df1"/><stop offset=".87" stop-color="#31599d"/><stop offset="1" stop-color="#26385f" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#ff6c67" stop-opacity=".3"/><stop offset=".46" stop-color="#6d5be6" stop-opacity=".14"/><stop offset="1" stop-color="#111827" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7d8cae" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Inter,Arial,sans-serif}.eyebrow{fill:#ff8975;font-size:15px;font-weight:700;letter-spacing:2.8px}.headline{fill:#f7f8fc;font-size:37px;font-weight:750;letter-spacing:-.5px}.deck{fill:#aeb7cb;font-size:18px}.kicker{font-size:14px;font-weight:700;letter-spacing:2px}.groupTitle{fill:#fff;font-size:22px;font-weight:700}.repos{fill:#c5ccdc;font-size:16px}.role{fill:#8995ae;font-size:14px}.brand{fill:#fff;font-size:18px;font-weight:750;letter-spacing:1.6px}.contract{fill:#9ca8c2;font-size:14px;font-weight:600;letter-spacing:.8px}.foundationTitle{fill:#fff;font-size:17px;font-weight:700}.foundationNote{fill:#aeb9d2;font-size:15px}
    </style>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <rect x="46" y="177" width="1108" height="510" rx="28" fill="url(#stage)" stroke="#293348" stroke-width="2" filter="url(#shadow)"/>
  <rect x="46" y="177" width="1108" height="510" rx="28" fill="url(#grid)"/>
  <path d="M47 226H1153" stroke="#2c364b"/>
  <circle cx="600" cy="405" r="278" fill="url(#halo)"/>

  <g transform="translate(60 54)">
    <path d="M0 11L11 0L22 11L11 22Z" fill="none" stroke="#ff7868" stroke-width="3"/><path d="M7 7L15 15M15 7L7 15" stroke="#ff7868" stroke-width="2.5" stroke-linecap="round"/>
    <text x="40" y="17" class="eyebrow">CODEBASE / OWNERSHIP</text>
  </g>
  <text x="60" y="117" class="headline">One system. Explicit boundaries.</text>
  <text x="60" y="149" class="deck">Every repository has a job; the shared contracts keep them one platform.</text>

  <g fill="none" stroke-linecap="round">
    <path d="M358 326C444 326 478 347 518 374" stroke="#ff796d" stroke-opacity=".48" stroke-width="2"/>
    <path d="M842 326C756 326 722 347 682 374" stroke="#7290ff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M358 503C448 493 483 458 526 429" stroke="#ff796d" stroke-opacity=".34" stroke-width="2"/>
    <path d="M842 503C752 493 717 458 674 429" stroke="#eab36b" stroke-opacity=".4" stroke-width="2"/>
    <path d="M600 494V594" stroke="#758cf0" stroke-opacity=".65" stroke-width="2"/>
  </g>
  <g fill="#0d1422" stroke-width="2"><circle cx="358" cy="326" r="6" stroke="#ff796d"/><circle cx="842" cy="326" r="6" stroke="#7290ff"/><circle cx="358" cy="503" r="6" stroke="#ff796d"/><circle cx="842" cy="503" r="6" stroke="#eab36b"/></g>

  <g transform="translate(82 258)">
    <text class="kicker" fill="#ff9a88">CREATOR</text><text y="35" class="groupTitle">Author and build</text><text y="70" class="repos">studio  ·  tools  ·  examples</text><text y="98" class="role">source, import, preview, packaging</text>
  </g>
  <g transform="translate(876 258)">
    <text class="kicker" fill="#9fb0ff">PLAYER HOSTS</text><text y="35" class="groupTitle">Open and play</text><text y="70" class="repos">web  ·  ios_app</text><text y="96" class="repos">android_app  ·  desktop</text>
  </g>
  <g transform="translate(82 451)">
    <text class="kicker" fill="#ff9a88">CONTENT</text><text y="35" class="groupTitle">Ship worlds</text><text y="70" class="repos">first-game  ·  second-game</text><text y="96" class="repos">third-game</text>
  </g>
  <g transform="translate(876 451)">
    <text class="kicker" fill="#efc17d">SERVICES</text><text y="35" class="groupTitle">Coordinate</text><text y="70" class="repos">backend  ·  developer</text><text y="96" class="repos">deployed</text>
  </g>

  <g transform="translate(600 389)" filter="url(#shadow)">
    <ellipse cy="88" rx="105" ry="25" fill="#070a12" opacity=".72"/>
    <ellipse cy="78" rx="82" ry="18" fill="#6681ff" opacity=".2" filter="url(#glow)"/>
    <path d="M0 -95L72 -23L0 49L-72 -23Z" fill="#131b30" stroke="#ff7868" stroke-width="4" filter="url(#glow)"/>
    <path d="M0 -63L40 -23L0 17L-40 -23Z" fill="url(#coral)"/>
    <path d="M-15 -38L15 -8M15 -38L-15 -8" stroke="#fff2ed" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="600" y="507" text-anchor="middle" class="brand">CUBACADABRA</text>
  <text x="600" y="532" text-anchor="middle" class="contract">DOCS · CONTRACTS · DECISIONS</text>

  <g transform="translate(238 594)">
    <path d="M0 40H724" stroke="url(#foundation)" stroke-width="3"/>
    <rect x="84" width="556" height="78" rx="18" fill="#111a2d" stroke="#4f6dd0" stroke-width="2"/>
    <rect x="104" y="17" width="5" height="44" rx="3" fill="#6f8cff"/>
    <text x="128" y="34" class="foundationTitle">RUST</text><text x="128" y="57" class="foundationNote">shared runtime foundation</text>
    <text x="610" y="34" text-anchor="end" fill="#8fa7ff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">ONE SEMANTIC CORE</text><text x="610" y="57" text-anchor="end" class="role">engine · client · app</text>
  </g>
</svg>
