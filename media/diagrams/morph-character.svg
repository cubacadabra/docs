<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra Morph asset anatomy</title><desc id="desc">A character is composed from body, clothing, hair, face, skeleton, and textures, then compiled into a versioned MorphPack for the shared runtime and catalog.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f1e7"/><stop offset="1" stop-color="#e9e5f6"/></linearGradient><linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff836f"/><stop offset="1" stop-color="#714fe0"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#303052" flood-opacity=".24"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#714fe0"/></marker></defs>
  <rect width="1500" height="820" rx="32" fill="url(#bg)"/><text x="72" y="76" fill="#6849c8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">ASSETS / MORPH</text><text x="72" y="122" fill="#17152b" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">A person, not a pipeline.</text><text x="72" y="153" fill="#5e5b77" font-family="Inter,Arial,sans-serif" font-size="17">Editable layers become one versioned character asset.</text>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#332f4d"><path d="M205 263H380M205 343H380M205 423H380M205 503H380" stroke="#c0b4df" stroke-width="2"/><text x="80" y="268" font-weight="700">body</text><text x="80" y="348" font-weight="700">clothing</text><text x="80" y="428" font-weight="700">hair + face</text><text x="80" y="508" font-weight="700">skeleton + textures</text></g>
  <g transform="translate(400 205)" filter="url(#shadow)"><ellipse cx="216" cy="514" rx="130" ry="24" fill="#756c92" opacity=".22"/><path d="M151 206C151 164 169 140 216 140C263 140 281 164 281 206V244H151Z" fill="#4d241d"/><circle cx="216" cy="224" r="70" fill="#c99372"/><path d="M151 214C152 152 178 132 218 132C265 132 286 160 280 213C260 192 244 184 223 180C203 193 179 204 151 214Z" fill="#54271e"/><path d="M157 296C172 276 189 267 216 267C243 267 260 276 275 296L303 418C275 443 157 443 129 418Z" fill="url(#coat)"/><path d="M164 316C183 331 249 331 268 316" fill="none" stroke="#ffc4b7" stroke-width="5" opacity=".65"/><circle cx="190" cy="224" r="6" fill="#2b2137"/><circle cx="242" cy="224" r="6" fill="#2b2137"/><path d="M178 257C199 270 233 270 254 257" fill="none" stroke="#7f4c4a" stroke-width="5" stroke-linecap="round"/><path d="M177 430L207 430L200 505L162 505Z" fill="#273260"/><path d="M225 430L255 430L270 505L232 505Z" fill="#273260"/><path d="M158 500H204C211 500 214 508 207 515H153C146 509 150 501 158 500Z" fill="#34274a"/><path d="M231 500H273C281 501 286 509 279 515H225C219 508 223 501 231 500Z" fill="#34274a"/><path d="M216 155V390M179 333L216 356L253 333M177 411L216 390L256 411" fill="none" stroke="#f8dfd4" stroke-width="2" stroke-dasharray="5 7" opacity=".72"/></g>
  <path d="M723 410C780 410 796 410 842 410" stroke="#714fe0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="742" y="383" fill="#6849c8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">compile + validate</text>
  <g transform="translate(900 242)" filter="url(#shadow)"><rect width="420" height="350" rx="24" fill="#16152d"/><path d="M0 62H420" stroke="#3c3a60" stroke-width="2"/><circle cx="28" cy="31" r="7" fill="#ff836f"/><circle cx="52" cy="31" r="7" fill="#e7b76f"/><circle cx="76" cy="31" r="7" fill="#758af0"/><text x="28" y="111" fill="#ff9b83" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">MORPHPACK v5</text><text x="28" y="140" fill="#9da2c6" font-family="Inter,Arial,sans-serif" font-size="14">versioned binary asset</text><g font-family="Inter,Arial,sans-serif" font-size="15"><rect x="28" y="172" width="364" height="38" rx="8" fill="#262443"/><text x="44" y="197" fill="#f2efff">header + schema</text><rect x="28" y="218" width="364" height="38" rx="8" fill="#262443"/><text x="44" y="243" fill="#f2efff">skeleton + body</text><rect x="28" y="264" width="364" height="38" rx="8" fill="#302650"/><text x="44" y="289" fill="#f2efff">wearables + textures</text><rect x="28" y="310" width="364" height="18" rx="9" fill="#ff836f" opacity=".85"/></g></g>
  <path d="M1320 417H1408" stroke="#714fe0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="1300" y="388" text-anchor="end" fill="#6849c8" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">catalog + runtime</text><g transform="translate(71 700)"><rect width="1350" height="62" rx="31" fill="#fff" opacity=".7" stroke="#d0c9df"/><text x="34" y="38" fill="#332f4d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">The contract matters at both ends:</text><text x="285" y="38" fill="#5e5b77" font-family="Inter,Arial,sans-serif" font-size="15">safe import in Studio · exact bytes in the package · the same composition on every host</text></g>
</svg>
