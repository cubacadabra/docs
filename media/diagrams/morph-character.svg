<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra Morph asset anatomy</title>
  <desc id="desc">Editable body, clothing, hair, face, skeleton, and texture layers compile into one versioned MorphPack used by the catalog and runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f2e9"/><stop offset="1" stop-color="#ebe7f7"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff836f"/><stop offset="1" stop-color="#714fe0"/></linearGradient>
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18162f"/><stop offset="1" stop-color="#242044"/></linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#303052" flood-opacity=".23"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#714fe0"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif}.eyebrow{fill:#6849c8;font-size:15px;font-weight:700;letter-spacing:2.8px}.headline{fill:#17152b;font-size:36px;font-weight:750}.deck{fill:#5e5b77;font-size:18px}.layer{fill:#332f4d;font-size:17px;font-weight:700}.packTitle{fill:#ff9b83;font-size:19px;font-weight:700}.packNote{fill:#aeb2d2;font-size:15px}.row{fill:#f3f1ff;font-size:16px}.action{fill:#6849c8;font-size:15px;font-weight:700}.footer{fill:#4d4964;font-size:16px}@media(max-width:600px){.deck,.packNote,.action,.footer{display:none}.eyebrow{font-size:19px}.headline{font-size:42px}.layer,.packTitle,.row{font-size:24px}}</style>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="60" y="62" class="eyebrow">ASSETS / MORPH</text><text x="60" y="108" class="headline">A person, not a pipeline.</text><text x="60" y="140" class="deck">Editable layers become one versioned character asset.</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="60" y="248" class="layer">body</text><path d="M175 243H285" stroke="#b8acdc" stroke-width="2"/>
    <text x="60" y="326" class="layer">clothing</text><path d="M175 321H285" stroke="#b8acdc" stroke-width="2"/>
    <text x="60" y="404" class="layer">hair + face</text><path d="M175 399H285" stroke="#b8acdc" stroke-width="2"/>
    <text x="60" y="482" class="layer">rig + textures</text><path d="M175 477H285" stroke="#b8acdc" stroke-width="2"/>
  </g>

  <g transform="translate(275 170)" filter="url(#shadow)">
    <ellipse cx="150" cy="423" rx="104" ry="19" fill="#756c92" opacity=".2"/>
    <path d="M96 164C96 126 116 105 150 105C184 105 204 126 204 164V194H96Z" fill="#4d241d"/>
    <circle cx="150" cy="176" r="58" fill="#c99372"/>
    <path d="M96 167C98 118 119 101 152 101C188 101 210 123 204 167C187 150 174 143 155 140C138 151 118 160 96 167Z" fill="#54271e"/>
    <path d="M102 239C115 222 130 214 150 214C170 214 185 222 198 239L225 339C201 360 99 360 75 339Z" fill="url(#coat)"/>
    <path d="M107 255C124 267 176 267 193 255" fill="none" stroke="#ffc4b7" stroke-width="5" opacity=".65"/>
    <circle cx="129" cy="176" r="5" fill="#2b2137"/><circle cx="171" cy="176" r="5" fill="#2b2137"/><path d="M120 203C138 214 162 214 180 203" fill="none" stroke="#7f4c4a" stroke-width="4" stroke-linecap="round"/>
    <path d="M98 350H137L133 414H88Z" fill="#273260"/><path d="M163 350H202L212 414H167Z" fill="#273260"/>
    <path d="M86 408H137C143 408 146 416 139 422H80C75 416 79 409 86 408Z" fill="#34274a"/><path d="M165 408H213C220 409 224 416 218 422H160C155 416 158 409 165 408Z" fill="#34274a"/>
    <path d="M150 117V319M119 271L150 290L181 271M117 336L150 319L184 336" fill="none" stroke="#f8dfd4" stroke-width="2" stroke-dasharray="5 7" opacity=".75"/>
  </g>

  <path d="M530 363H625" stroke="#714fe0" stroke-width="3" marker-end="url(#arrow)"/><text x="550" y="338" class="action">compile</text>

  <g transform="translate(648 210)" filter="url(#shadow)">
    <rect width="360" height="320" rx="22" fill="url(#pack)"/>
    <path d="M0 58H360" stroke="#464369" stroke-width="2"/><circle cx="25" cy="29" r="7" fill="#ff836f"/><circle cx="49" cy="29" r="7" fill="#e7b76f"/><circle cx="73" cy="29" r="7" fill="#758af0"/>
    <text x="25" y="100" class="packTitle">MORPHPACK v5</text><text x="25" y="127" class="packNote">one versioned binary asset</text>
    <g font-family="Inter,Arial,sans-serif"><rect x="25" y="157" width="310" height="40" rx="8" fill="#292747"/><text x="42" y="183" class="row">header + schema</text><rect x="25" y="207" width="310" height="40" rx="8" fill="#292747"/><text x="42" y="233" class="row">skeleton + body</text><rect x="25" y="257" width="310" height="40" rx="8" fill="#342952"/><text x="42" y="283" class="row">wearables + textures</text></g>
  </g>

  <path d="M1008 363H1061" stroke="#714fe0" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(1084 363)"><circle r="55" fill="#fff" opacity=".78" stroke="#b9aed9" stroke-width="2"/><path d="M-22 -4L0 -16L22 -4L0 8Z" fill="#ff836f"/><path d="M-22 -4L0 8V31L-22 19Z" fill="#c75270"/><path d="M0 8L22 -4V19L0 31Z" fill="#714fe0"/><text y="79" text-anchor="middle" fill="#332f4d" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">catalog + runtime</text></g>

  <g transform="translate(60 641)"><rect width="1080" height="44" rx="22" fill="#fff" opacity=".72" stroke="#d0c9df"/><text x="540" y="28" text-anchor="middle" class="footer">Safe import in Studio · exact bytes in the Cube · the same character on every host</text></g>
</svg>
