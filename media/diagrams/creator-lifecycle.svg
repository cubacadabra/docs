<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra creator lifecycle</title>
  <desc id="desc">A creator authors local source, builds and verifies a Cube, previews it in Player, and explicitly publishes a release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset="1" stop-color="#19142e"/></linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8d72"/><stop offset="1" stop-color="#7550df"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ff826e"/></marker>
    <style>text{font-family:Inter,Arial,sans-serif}.eyebrow{fill:#ff8a75;font-size:15px;font-weight:700;letter-spacing:2.8px}.headline{fill:#f8f8fc;font-size:36px;font-weight:750}.deck{fill:#b0b6d2;font-size:18px}.phase{fill:#fff;font-size:18px;font-weight:700}.note{fill:#aeb5d3;font-size:15px}.verb{fill:#ffb2a2;font-size:15px;font-weight:700}.footer{fill:#c8cde4;font-size:16px}@media(max-width:600px){.deck,.note,.verb,.footer{display:none}.eyebrow{font-size:19px}.headline{font-size:42px}.phase{font-size:28px}}</style>
  </defs>
  <rect width="1200" height="680" rx="30" fill="url(#bg)"/>
  <text x="60" y="62" class="eyebrow">CREATOR LOOP</text><text x="60" y="108" class="headline">Make locally. Test honestly. Share a Cube.</text><text x="60" y="140" class="deck">One artifact moves from editable source to every Player host.</text>
  <path d="M147 345C318 190 882 190 1053 345C882 500 318 500 147 345Z" fill="none" stroke="#353b68" stroke-width="2" stroke-dasharray="8 11"/>

  <g transform="translate(62 250)"><circle cx="85" cy="85" r="84" fill="#152348" stroke="#ff826e" stroke-width="3" filter="url(#glow)"/><rect x="39" y="43" width="92" height="62" rx="8" fill="#0b1025" stroke="#ff9c83" stroke-width="3"/><path d="M49 90L75 69L96 84L122 63" fill="none" stroke="#7188ef" stroke-width="5"/><text x="85" y="136" text-anchor="middle" class="phase">AUTHOR</text><text x="85" y="160" text-anchor="middle" class="note">Studio + source</text></g>
  <path d="M246 335H335" stroke="#ff826e" stroke-width="3" marker-end="url(#arrow)"/><text x="272" y="310" class="verb">build</text>

  <g transform="translate(344 250)"><circle cx="85" cy="85" r="84" fill="#182452" stroke="#7188ea" stroke-width="3"/><path d="M49 64L85 45L121 64L85 83Z" fill="url(#cube)"/><path d="M49 64L85 83V122L49 103Z" fill="#d35468"/><path d="M85 83L121 64V103L85 122Z" fill="#7658db"/><path d="M57 134H113" stroke="#a7b6ff" stroke-width="4"/><text x="85" y="157" text-anchor="middle" class="phase">VERIFY</text><text x="85" y="181" text-anchor="middle" class="note">package + hashes</text></g>
  <path d="M528 335H617" stroke="#ff826e" stroke-width="3" marker-end="url(#arrow)"/><text x="547" y="310" class="verb">preview</text>

  <g transform="translate(626 250)"><circle cx="85" cy="85" r="84" fill="#19204b" stroke="#9a79e9" stroke-width="3"/><rect x="44" y="48" width="82" height="61" rx="9" fill="#303570"/><path d="M44 96L70 76L92 87L126 67V109H44Z" fill="#6f8dee"/><circle cx="90" cy="72" r="7" fill="#ff826e"/><text x="85" y="136" text-anchor="middle" class="phase">PLAY</text><text x="85" y="160" text-anchor="middle" class="note">shared runtime</text></g>
  <path d="M810 335H899" stroke="#ff826e" stroke-width="3" marker-end="url(#arrow)"/><text x="827" y="310" class="verb">publish</text>

  <g transform="translate(908 250)"><circle cx="85" cy="85" r="84" fill="#1b2147" stroke="#e6b56e" stroke-width="3"/><path d="M52 84C52 62 67 49 85 49C103 49 118 62 118 84V114H52Z" fill="#e8b66f"/><circle cx="85" cy="79" r="16" fill="#ffe1b2"/><path d="M41 121H129" stroke="#ff826e" stroke-width="5" stroke-linecap="round"/><text x="85" y="149" text-anchor="middle" class="phase">SHARE</text><text x="85" y="173" text-anchor="middle" class="note">explicit release</text></g>

  <g transform="translate(60 584)"><rect width="1080" height="48" rx="24" fill="#121a39" stroke="#334276"/><text x="540" y="30" text-anchor="middle" class="footer">Inspectable source · reproducible output · explicit release evidence</text></g>
</svg>
