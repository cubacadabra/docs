<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Cubacadabra creator lifecycle</title><desc id="desc">A creator moves from local authoring in Studio through validation and a portable package to preview, publish, and play across hosts.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset="1" stop-color="#18142d"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ff826e"/></marker></defs>
  <rect width="1500" height="760" rx="32" fill="url(#bg)"/><text x="72" y="76" fill="#ff846d" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">START / CREATOR LOOP</text><text x="72" y="122" fill="#f7f7fb" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Make locally. Test honestly. Share a Cube.</text><text x="72" y="153" fill="#a9afd0" font-family="Inter,Arial,sans-serif" font-size="17">The same package moves from an editable source to every Player host.</text><path d="M196 386C425 166 1075 166 1304 386C1075 606 425 606 196 386Z" fill="none" stroke="#343a67" stroke-width="2" stroke-dasharray="8 12"/>
  <g font-family="Inter,Arial,sans-serif"><g transform="translate(105 294)"><circle cx="92" cy="92" r="92" fill="#162449" stroke="#ff826e" stroke-width="3" filter="url(#glow)"/><rect x="43" y="49" width="98" height="68" rx="8" fill="#0b1025" stroke="#ff9c83" stroke-width="3"/><path d="M53 99L82 75L104 90L133 67" fill="none" stroke="#6b83ec" stroke-width="5"/><text x="92" y="145" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">AUTHOR</text><text x="92" y="169" text-anchor="middle" fill="#abb3d4" font-size="13">Studio + source</text></g><path d="M320 386H430" stroke="#ff826e" stroke-width="3" marker-end="url(#arrow)"/><text x="344" y="358" fill="#ffad9d" font-size="13" font-weight="700">build</text><g transform="translate(435 294)"><circle cx="92" cy="92" r="92" fill="#182452" stroke="#7188ea" stroke-width="3"/><path d="M53 72L92 51L131 72L92 93Z" fill="#ff826e"/><path d="M53 72L92 93V137L53 116Z" fill="#d35468"/><path d="M92 93L131 72V116L92 137Z" fill="#7658db"/><path d="M61 151H123" stroke="#9eafff" stroke-width="4"/><text x="92" y="177" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">VERIFY</text><text x="92" y="201" text-anchor="middle" fill="#abb3d4" font-size="13">validation + hashes</text></g><path d="M650 386H760" stroke="#ff826e" stroke-width="3" marker-end="url(#arrow)"/><text x="672" y="358" fill="#ffad9d" font-size="13" font-weight="700">preview</text><g transform="translate(765 294)"><circle cx="92" cy="92" r="92" fill="#19204b" stroke="#9a79e9" stroke-width="3"/><rect x="50" y="53" width="84" height="66" rx="9" fill="#303570"/><path d="M50 105L78 84L101 95L134 73V119H50Z" fill="#6f8dee"/><circle cx="94" cy="80" r="7" fill="#ff826e"/><text x="92" y="145" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">PLAY</text><text x="92" y="169" text-anchor="middle" fill="#abb3d4" font-size="13">same runtime</text></g><path d="M980 386H1090" stroke="#ff826e" stroke-width="3" marker-end="url(#arrow)"/><text x="1000" y="358" fill="#ffad9d" font-size="13" font-weight="700">publish</text><g transform="translate(1095 294)"><circle cx="92" cy="92" r="92" fill="#1b2147" stroke="#e6b56e" stroke-width="3"/><path d="M57 91C57 68 73 54 92 54C111 54 127 68 127 91V124H57Z" fill="#e8b66f"/><circle cx="92" cy="85" r="17" fill="#ffe1b2"/><path d="M44 130H140" stroke="#ff826e" stroke-width="5" stroke-linecap="round"/><text x="92" y="159" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">SHARE</text><text x="92" y="183" text-anchor="middle" fill="#abb3d4" font-size="13">release boundary</text></g></g>
  <g transform="translate(72 668)" font-family="Inter,Arial,sans-serif"><rect width="1356" height="46" rx="23" fill="#121a39" stroke="#303c70"/><text x="678" y="29" text-anchor="middle" fill="#c2c8e3" font-size="14">Creator source stays inspectable · generated output stays reproducible · release evidence stays explicit</text></g>
</svg>
